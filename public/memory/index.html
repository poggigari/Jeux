<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory</title>
<style>
  :root{
    --bg1:#fbc2eb; --bg2:#a6c1ee;
    --panel:#ffffff; --panel2:#f5f3fc; --bord:#e3def6;
    --texte:#2d2a45; --sourdine:#8b87a3;
    --accent:#7c5cff; --accent2:#6647e0;
    --ok:#2ecc71; --ok-fond:#e7f9ef;
    --danger:#ff5c7a; --or:#f5a623;
    --ombre: 0 8px 24px rgba(60, 50, 110, .12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--texte);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
    padding:26px 14px 44px;
  }
  h1{font-size:1.5rem; margin:0 0 18px; letter-spacing:.01em; font-weight:800;}

  .carte-panneau{
    background:var(--panel); border:1px solid var(--bord); border-radius:20px;
    padding:24px; width:100%; max-width:420px; box-shadow:var(--ombre);
  }
  .champ{
    width:100%; background:var(--panel2); border:1px solid var(--bord); color:var(--texte);
    border-radius:12px; padding:12px 14px; font-size:1rem; margin-bottom:14px; outline:none;
  }
  .champ:focus{border-color:var(--accent);}
  .etiquette{font-size:.82rem; color:var(--sourdine); display:block; margin-bottom:6px; font-weight:600;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; border:none; border-radius:12px;
    padding:13px 18px; font-size:1rem; font-weight:700; cursor:pointer; width:100%;
    transition:transform .12s, box-shadow .12s; box-shadow:0 4px 14px rgba(124,92,255,.35);
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(124,92,255,.45);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{background:#cfc9e8; color:#8b87a3; box-shadow:none; cursor:not-allowed;}
  .btn.secondaire{background:var(--panel2); color:var(--texte); border:1px solid var(--bord); box-shadow:none;}
  .btn.secondaire:hover{background:var(--bord); box-shadow:none;}
  .lien-onglet{display:flex; gap:8px; margin-bottom:18px;}
  .lien-onglet button{
    flex:1; padding:10px; border-radius:12px; border:1px solid var(--bord); background:transparent;
    color:var(--sourdine); font-weight:700; cursor:pointer;
  }
  .lien-onglet button.actif{background:var(--accent); color:#fff; border-color:var(--accent);}
  .erreur{color:var(--danger); font-size:.88rem; margin:-6px 0 12px; min-height:1em;}
  .aide{color:var(--sourdine); font-size:.78rem; margin:-8px 0 14px;}
  .code-affiche{
    text-align:center; font-size:2.1rem; font-weight:800; letter-spacing:.28em;
    background:var(--panel2); border:1px dashed var(--bord); border-radius:14px;
    padding:16px 10px; margin:10px 0 18px; color:var(--accent2);
  }
  .liste-joueurs{list-style:none; margin:0 0 18px; padding:0;}
  .liste-joueurs li{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; background:var(--panel2); border-radius:12px; margin-bottom:6px;
  }
  .liste-joueurs .pastille{width:8px; height:8px; border-radius:50%; background:var(--sourdine); margin-right:8px; display:inline-block;}
  .liste-joueurs .pastille.on{background:var(--ok);}
  .liste-joueurs .moi{color:var(--accent2); font-weight:700;}
  .note{color:var(--sourdine); font-size:.85rem; text-align:center; margin-top:10px;}

  /* ---- plateau de jeu ---- */
  .zone-jeu{width:100%; max-width:760px;}
  .entete-jeu{display:flex; align-items:center; justify-content:center; margin-bottom:16px; gap:10px; flex-wrap:wrap;}
  .scores{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .score-carte{
    background:var(--panel); border:1px solid var(--bord); border-radius:14px; padding:10px 14px;
    font-size:.86rem; min-width:96px; box-shadow:var(--ombre);
  }
  .score-carte.tour{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset, var(--ombre);}
  .score-carte .nom{font-weight:700; display:flex; align-items:center; gap:6px;}
  .score-carte .pts{color:var(--accent2); font-size:1.25rem; font-weight:800;}
  .badge-tour{color:var(--accent); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .plateau{ display:grid; grid-template-columns:repeat(var(--colonnes, 5), 1fr); gap:9px; width:100%; }

  .carte{ aspect-ratio:3/4; position:relative; cursor:pointer; perspective:700px; }
  .carte.trouvee, .carte.visible{cursor:default;}
  .carte-face{
    position:absolute; inset:0; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:clamp(1.1rem, 4vw, 1.7rem); backface-visibility:hidden; transition:transform .4s;
  }
  .carte-dos{ background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .carte-dos::after{ content:""; position:absolute; inset:6px; border-radius:7px; border:2px solid rgba(255,255,255,.22); }
  .carte-recto{ background:var(--panel); border:1px solid var(--bord); transform:rotateY(180deg); box-shadow:var(--ombre); }
  .carte.visible .carte-dos{transform:rotateY(-180deg);}
  .carte.visible .carte-recto{transform:rotateY(0deg);}
  .carte.trouvee .carte-recto{background:var(--ok-fond); border-color:var(--ok);}
  .carte:not(.trouvee):not(.visible):hover .carte-dos{filter:brightness(1.08); transform:translateY(-2px);}

  .message-tour{ text-align:center; margin:16px 0 6px; font-size:.95rem; color:var(--texte); min-height:1.3em; font-weight:700; }
  .message-tour.attente{color:var(--danger);}
  .message-tour.moi{color:var(--accent2);}

  .ecran-fin{
    text-align:center; padding:28px 20px; background:var(--panel); border:1px solid var(--bord);
    border-radius:18px; margin-top:18px; box-shadow:var(--ombre);
  }
  .ecran-fin .titre-fin{font-size:1.5rem; margin-bottom:6px; font-weight:800;}

  .lien-partage{display:flex; gap:8px; margin-top:8px;}
  .lien-partage input{flex:1;}
  .lien-partage button{width:auto; padding:12px 14px;}

  .footer-connexion{position:fixed; bottom:10px; right:14px; font-size:.72rem; color:var(--sourdine);}
</style>
</head>
<body>

<h1>🃏 Memory</h1>

<div id="racine" class="carte-panneau"></div>
<div class="footer-connexion" id="etatConnexion"></div>

<script>
const racine = document.getElementById("racine");
const etatConnexion = document.getElementById("etatConnexion");

const MIN_TUILES = 4;
const MAX_TUILES = 60;
const DEFAUT_TUILES = 40;

let session = null; // { code, joueurId, token }
let source = null;
let donnees = null;
let erreurMsg = "";

function chargerSession(){
  try{ return JSON.parse(localStorage.getItem("memory_session") || "null"); }catch(e){ return null; }
}
function sauverSession(){ localStorage.setItem("memory_session", JSON.stringify(session)); }

async function appel(chemin, corps){
  const r = await fetch(chemin, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(corps || {}) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.erreur || "Erreur");
  return j;
}
function urlPartage(code){ return location.origin + location.pathname + "#" + code; }
function colonnesPourNbTuiles(n){
  const c = Math.ceil(Math.sqrt(n));
  return Math.min(Math.max(c, 4), 10);
}

/* ---------------- rendu : accueil ---------------- */
function rendreAccueil(){
  const hash = location.hash.replace("#","").toUpperCase();
  racine.className = "carte-panneau";
  let mode = hash ? "rejoindre" : "creer";

  function contenu(){
    return `
      <div class="lien-onglet">
        <button id="ongletCreer" class="${mode==='creer'?'actif':''}">Créer</button>
        <button id="ongletRejoindre" class="${mode==='rejoindre'?'actif':''}">Rejoindre</button>
      </div>
      <label class="etiquette">Votre prénom</label>
      <input id="champNom" class="champ" placeholder="Prénom" maxlength="20" autocomplete="off">
      ${mode==="rejoindre" ? `
        <label class="etiquette">Code de la partie</label>
        <input id="champCode" class="champ" placeholder="ex. AB3F" maxlength="4" style="text-transform:uppercase;" value="${hash}">
      ` : `
        <label class="etiquette">Nombre de tuiles (nombre pair, ${MIN_TUILES} à ${MAX_TUILES})</label>
        <input id="champNbTuiles" type="number" class="champ" min="${MIN_TUILES}" max="${MAX_TUILES}" step="2" value="${DEFAUT_TUILES}">
        <div class="aide">Détermine le nombre de paires à trouver.</div>
      `}
      <div class="erreur">${erreurMsg}</div>
      <button id="btnValider" class="btn">${mode==="creer" ? "Créer la partie" : "Rejoindre"}</button>
    `;
  }
  racine.innerHTML = contenu();

  function brancherOnglets(){
    document.getElementById("ongletCreer").onclick = () => { mode="creer"; erreurMsg=""; racine.innerHTML = contenu(); brancherOnglets(); brancherValider(); };
    document.getElementById("ongletRejoindre").onclick = () => { mode="rejoindre"; erreurMsg=""; racine.innerHTML = contenu(); brancherOnglets(); brancherValider(); };
  }
  function brancherValider(){
    document.getElementById("btnValider").onclick = async () => {
      const nom = document.getElementById("champNom").value.trim();
      if(!nom){ erreurMsg="Entrez un prénom."; racine.innerHTML = contenu(); brancherOnglets(); brancherValider(); return; }
      erreurMsg = "";
      try{
        if(mode==="creer"){
          let nbTuiles = parseInt(document.getElementById("champNbTuiles").value, 10);
          const r = await appel("/memory/api/session", {nom, nbTuiles});
          session = {code:r.code, joueurId:r.joueurId, token:r.token};
        } else {
          const code = document.getElementById("champCode").value.trim().toUpperCase();
          if(!code){ erreurMsg="Entrez le code de la partie."; racine.innerHTML = contenu(); brancherOnglets(); brancherValider(); return; }
          const r = await appel(`/memory/api/session/${code}/join`, {nom});
          session = {code, joueurId:r.joueurId, token:r.token};
        }
        sauverSession();
        ouvrirFlux();
      }catch(e){ erreurMsg = e.message; racine.innerHTML = contenu(); brancherOnglets(); brancherValider(); }
    };
  }
  brancherOnglets();
  brancherValider();
}

/* ---------------- flux temps reel ---------------- */
function ouvrirFlux(){
  if(source) source.close();
  racine.className = "carte-panneau";
  racine.innerHTML = `<div class="note">Connexion…</div>`;
  source = new EventSource(`/memory/api/session/${session.code}/stream?joueurId=${session.joueurId}&token=${session.token}`);
  source.onmessage = (ev) => { donnees = JSON.parse(ev.data); rendre(); };
  source.onopen = () => { etatConnexion.textContent = "connecté"; };
  source.onerror = () => { etatConnexion.textContent = "reconnexion…"; };
}

/* ---------------- rendu principal ---------------- */
function rendre(){
  if(!donnees) return;
  if(donnees.phase === "lobby") return rendreAttente();
  return rendreJeu();
}

function rendreAttente(){
  racine.className = "carte-panneau";
  const moi = session.joueurId;
  const estHote = donnees.hostId === moi;
  racine.innerHTML = `
    <div style="text-align:center; margin-bottom:6px; color:var(--sourdine); font-size:.85rem;">Salle d'attente</div>
    <div class="code-affiche">${donnees.code}</div>
    <div class="lien-partage">
      <input class="champ" id="lienInput" readonly value="${urlPartage(donnees.code)}" onclick="this.select()">
      <button class="btn secondaire" id="btnCopier">Copier</button>
    </div>
    <ul class="liste-joueurs" style="margin-top:16px;">
      ${donnees.joueurs.map(j => `
        <li>
          <span><span class="pastille ${j.connecte?'on':''}"></span>${j.nom}${j.id===moi?' <span class="moi">(vous)</span>':''}</span>
          ${j.id===donnees.hostId ? '<span style="color:var(--sourdine); font-size:.78rem;">hôte</span>' : ''}
        </li>
      `).join("")}
    </ul>
    <div class="aide" style="text-align:center;">${donnees.nbTuiles} tuiles, soit ${donnees.nbTuiles/2} paires.</div>
    ${estHote
      ? `<button class="btn" id="btnDemarrer" ${donnees.joueurs.length<2?'disabled':''}>
           ${donnees.joueurs.length<2 ? "En attente d'un 2ᵉ joueur…" : 'Démarrer la partie'}
         </button>`
      : `<div class="note">En attente que l'hôte démarre la partie…</div>`
    }
    <div class="note">Partagez le code ou le lien pour inviter d'autres joueurs.</div>
  `;
  document.getElementById("btnCopier").onclick = () => { navigator.clipboard?.writeText(urlPartage(donnees.code)); };
  if(estHote){
    document.getElementById("btnDemarrer").onclick = async () => {
      try{ await appel(`/memory/api/session/${donnees.code}/start`, {joueurId: session.joueurId}); }
      catch(e){ alert(e.message); }
    };
  }
}

function rendreJeu(){
  const moi = session.joueurId;
  const monTour = donnees.tourDe === moi;
  const finie = donnees.phase === "finished";
  const colonnes = colonnesPourNbTuiles(donnees.plateau.length);

  racine.className = "zone-jeu";
  racine.innerHTML = `
    <div class="entete-jeu">
      <div class="scores">
        ${donnees.joueurs.map(j => `
          <div class="score-carte ${j.id===donnees.tourDe && !finie ? 'tour':''}">
            <div class="nom">${j.nom}${j.id===moi?' <span style="color:var(--accent2)">•</span>':''}</div>
            <div class="pts">${j.score}</div>
            ${j.id===donnees.tourDe && !finie ? '<div class="badge-tour">à son tour</div>' : ''}
          </div>
        `).join("")}
      </div>
    </div>

    <div class="message-tour ${donnees.enAttente ? 'attente' : (monTour ? 'moi' : '')}">
      ${finie ? '' : (donnees.enAttente
        ? (monTour ? "Cliquez une tuile pour continuer" : "L'adversaire referme et rejoue")
        : (monTour ? "À vous de jouer" : "Tour de l'adversaire"))}
    </div>

    <div class="plateau" id="plateau" style="--colonnes:${colonnes};">
      ${donnees.plateau.map(c => `
        <div class="carte ${c.visible?'visible':''} ${c.trouvee?'trouvee':''}" data-index="${c.index}">
          <div class="carte-face carte-dos"></div>
          <div class="carte-face carte-recto">${c.symbole || ""}</div>
        </div>
      `).join("")}
    </div>

    ${finie ? `
      <div class="ecran-fin">
        <div class="titre-fin">
          ${donnees.gagnants.length>1 ? "Égalité 🤝" : "🏆 " + donnees.joueurs.find(j=>j.id===donnees.gagnants[0]).nom + " gagne !"}
        </div>
        <div class="note">${donnees.joueurs.map(j=>j.nom+' : '+j.score).join(' — ')}</div>
        ${donnees.hostId===moi ? '<button class="btn" id="btnRejouer" style="margin-top:14px;">Rejouer</button>' : ''}
      </div>
    ` : ''}
  `;

  if(!finie){
    document.querySelectorAll(".carte").forEach(el => {
      el.onclick = async () => {
        if(!monTour) return;
        const i = Number(el.dataset.index);
        try{ await appel(`/memory/api/session/${donnees.code}/flip`, {joueurId: session.joueurId, index: i}); }
        catch(e){ /* coup invalide, ignoré silencieusement */ }
      };
    });
  } else if(donnees.hostId===moi){
    document.getElementById("btnRejouer").onclick = async () => {
      try{ await appel(`/memory/api/session/${donnees.code}/rejouer`, {joueurId: session.joueurId}); }
      catch(e){ alert(e.message); }
    };
  }
}

/* ---------------- demarrage ---------------- */
(function demarrer(){
  session = chargerSession();
  if(session && session.code && session.joueurId && session.token){
    ouvrirFlux();
  } else {
    rendreAccueil();
  }
})();
</script>
</body>
</html>
